<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事業内容 | GLORIS</title>
<meta name="description" content="GLORISの事業内容。いくつかの質問に答えるだけで、学校・教育委員会向けFELDNA、一般企業向けアプリ開発・業務相談など、知りたい情報にたどり着けます。">
<link rel="stylesheet" href="style.css">
<style>
  /* ============================================================
     事業内容ページ専用スタイル。
     質問に答えていくと、ページ遷移せずに求める情報へたどり着く
     ウィザード形式のUI(ぬるっと切り替わるアニメーション付き)。
     ============================================================ */

  .wizard-section{padding-top:8px;}
  .wizard-wrap{max-width:680px; margin:0 auto;}

  .crumbs{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
    margin-bottom:18px;
    min-height:22px;
  }
  .crumbs button{
    background:none;
    border:none;
    padding:2px 4px;
    font:inherit;
    font-size:0.82rem;
    color:var(--color-text-soft);
    cursor:pointer;
    font-weight:600;
  }
  .crumbs button:hover{color:var(--color-primary); text-decoration:underline;}
  .crumbs button.current{color:var(--color-primary-dark); cursor:default;}
  .crumbs button.current:hover{text-decoration:none;}
  .crumbs .sep{color:var(--border); font-size:0.8rem;}

  .wizard-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:40px 36px;
    min-height:340px;
    position:relative;
    overflow:hidden;
  }
  @media (max-width:600px){
    .wizard-card{padding:28px 20px;}
  }

  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    padding:0;
    margin-bottom:20px;
    font:inherit;
    font-size:0.85rem;
    font-weight:700;
    color:var(--color-text-soft);
    cursor:pointer;
  }
  .back-btn:hover{color:var(--color-primary);}

  .stage{
    transition:opacity .32s ease, transform .32s ease;
  }
  .stage.stage-hidden{
    opacity:0;
    transform:translateY(10px);
  }
  @media (prefers-reduced-motion: reduce){
    .stage{transition:none;}
  }

  .step-eyebrow{
    color:var(--color-primary);
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    margin:0 0 8px;
  }
  .step-title{
    font-size:clamp(1.15rem, 2.6vw, 1.5rem);
    margin:0 0 10px;
  }
  .step-lead{
    color:var(--color-text-soft);
    font-size:0.94rem;
    margin:0 0 28px;
  }

  .opt-grid{
    display:grid;
    gap:14px;
  }
  .opt-card{
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    text-align:left;
    background:var(--color-bg-soft);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 20px;
    font:inherit;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .15s;
  }
  .opt-card:hover{
    border-color:var(--color-primary);
    background:#fff;
    transform:translateY(-2px);
  }
  .opt-card .opt-num{
    flex:none;
    width:36px;height:36px;
    border-radius:50%;
    background:#fff;
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:0.85rem;
    color:var(--color-primary);
  }
  .opt-card .opt-num svg{width:18px;height:18px;}
  .opt-card .opt-body h3{
    margin:0 0 3px;
    font-size:1rem;
  }
  .opt-card .opt-body p{
    margin:0;
    font-size:0.84rem;
    color:var(--color-text-soft);
  }
  .opt-card .opt-arrow{
    margin-left:auto;
    flex:none;
    color:var(--color-text-soft);
    font-size:1.1rem;
  }

  .info-panel{text-align:center; padding:12px 0 4px;}
  .info-panel .info-icon{
    width:56px;height:56px;
    border-radius:50%;
    background:var(--color-bg-soft);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 20px;
    color:var(--color-primary);
  }
  .info-panel .info-icon svg{width:26px;height:26px;}
  .info-panel p{color:var(--color-text-soft); max-width:440px; margin:0 auto 28px;}
  .info-panel .btn{margin:0 6px 10px;}

  .pain-list{
    list-style:none;
    margin:0 0 24px;
    padding:0;
    display:grid;
    gap:10px;
  }
  .pain-item label{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--color-bg-soft);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    cursor:pointer;
    font-size:0.92rem;
    transition:border-color .15s, background .15s;
  }
  .pain-item input:checked + span{color:var(--color-primary-dark); font-weight:700;}
  .pain-item label:has(input:checked){
    border-color:var(--color-primary);
    background:#eef4fd;
  }
  .pain-item input{margin-top:3px; width:16px; height:16px; flex:none;}
  .pain-detail{
    display:none;
    width:100%;
    margin-top:4px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font:inherit;
    font-size:0.88rem;
    resize:vertical;
    min-height:64px;
    background:#fff;
  }
  .pain-detail.show{display:block;}
  .pain-actions{display:flex; justify-content:flex-end; margin-top:8px;}
  .pain-actions .btn:disabled{
    opacity:0.45;
    cursor:not-allowed;
  }
  .pain-actions .btn:disabled:hover{background:var(--color-primary); transform:none;}

  .app-grid{display:grid; gap:16px; grid-template-columns:repeat(2,1fr);}
  @media (max-width:520px){.app-grid{grid-template-columns:1fr;}}
  .app-card{
    background:var(--color-bg-soft);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px 18px;
    text-align:center;
    cursor:pointer;
    font:inherit;
    transition:border-color .15s, transform .15s, background .15s;
  }
  .app-card:hover{border-color:var(--color-primary); background:#fff; transform:translateY(-2px);}
  .app-card .ai-icon{
    width:44px;height:44px;
    border-radius:10px;
    background:#fff;
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;
    color:var(--color-primary);
  }
  .app-card .ai-icon svg{width:22px;height:22px;}
  .app-card h3{margin:0; font-size:0.95rem;}

  .app-detail{text-align:left;}
  .app-detail .ai-icon-lg{
    width:56px;height:56px;
    border-radius:12px;
    background:var(--color-bg-soft);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:18px;
    color:var(--color-primary);
  }
  .app-detail .ai-icon-lg svg{width:28px;height:28px;}
  .app-detail p{color:var(--color-text-soft); margin:0 0 24px;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">GLORIS</a>
    <nav>
      <ul>
        <li><a href="service.html">事業内容</a></li>
        <li><a href="company.html">会社概要</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>

</header>

<div class="page-hero">
  <div class="container">
    <div class="hero-eyebrow reveal">Service</div>
    <h1 class="reveal d1">事業内容</h1>
    <p class="reveal d2" style="color:var(--color-text-soft); max-width:480px; margin:12px auto 0;">
      いくつかの質問に答えるだけで、知りたい情報にたどり着けます。
    </p>
  </div>
</div>

<section class="wizard-section">
  <div class="container">
    <div class="wizard-wrap reveal d3">
      <div class="crumbs" id="crumbs"></div>
      <div class="wizard-card">
        <button class="back-btn" id="backBtn" type="button" hidden>← 戻る</button>
        <div class="stage" id="stage"></div>

    </div>

</section>

<footer>
  <div class="container">
    <div class="company-info">

    </div>
    <div class="legal-links">
      <a href="index.html#profile">代表紹介</a>

<script>
  // スクロールに応じて .reveal 要素をふわっと表示(他ページと共通の演出)
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) {
        e.target.classList.add("visible");
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll(".reveal").forEach((el) => io.observe(el));
</script>

<script>
  // ============================================================
  // 事業内容ウィザード
  // ページ遷移せず、質問に答えながら求める情報へたどり着くUI。
  // 各ステップは renderXxx() が HTML 文字列を返し、goTo() が
  // フェード+スライドで滑らかに切り替える。
  // ============================================================

  const stage = document.getElementById("stage");
  const crumbsEl = document.getElementById("crumbs");
  const backBtn = document.getElementById("backBtn");

  // 履歴スタック: { label, render } の配列。末尾が現在の画面。
  const history = [];

  function icon(paths) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
  }

  const ICONS = {
    school: icon('<path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5"/><path d="M21 8v6"/>'),
    building: icon('<rect x="4" y="3" width="16" height="18" rx="1"/><line x1="9" y1="7" x2="9" y2="7.01"/><line x1="15" y1="7" x2="15" y2="7.01"/><line x1="9" y1="11" x2="9" y2="11.01"/><line x1="15" y1="11" x2="15" y2="11.01"/><line x1="9" y1="15" x2="9" y2="15.01"/><line x1="15" y1="15" x2="15" y2="15.01"/>'),
    feldna: icon('<polygon points="12 3 20 8 4 8"/><rect x="5" y="8" width="14" height="13"/><rect x="10" y="15" width="4" height="6"/>'),
    chat: icon('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'),
    mail: icon('<path d="M4 4h16v16H4z"/><polyline points="4 4 12 13 20 4"/>'),
    userPlus: icon('<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3.1-7 7-7s7 3 7 7"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/>'),
    eye: icon('<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>'),
    book: icon('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'),
    web: icon('<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><circle cx="6.5" cy="6.5" r="0.6" fill="currentColor" stroke="none"/>'),
    apple: icon('<rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>'),
    spark: icon('<path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.9 4.9l2.8 2.8"/><path d="M16.3 16.3l2.8 2.8"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.9 19.1l2.8-2.8"/><path d="M16.3 7.7l2.8-2.8"/>'),
    door: icon('<path d="M5 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17"/><path d="M19 21H3"/><path d="M16 21V3"/><line x1="12" y1="12" x2="12" y2="12.01"/>'),
    tools: icon('<path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L2 19l3 3 7.1-7.1a4 4 0 0 0 5.6-5.6l-3 3-2-2z"/>'),
  };

  function renderOptions({ eyebrow, title, lead, options }) {
    return `
      <div class="step-eyebrow">${eyebrow}</div>
      <h2 class="step-title">${title}</h2>
      <p class="step-lead">${lead}</p>
      <div class="opt-grid">
        ${options.map((o, i) => `
          <button type="button" class="opt-card" data-idx="${i}">
            <span class="opt-num">${o.icon || (i + 1)}</span>
            <span class="opt-body">
              <h3>${o.title}</h3>
              <p>${o.desc}</p>
            </span>
            <span class="opt-arrow">→</span>
          </button>
        `).join("")}
      </div>
    `;
  }

  function bindOptions(options) {
    stage.querySelectorAll(".opt-card").forEach((btn) => {
      btn.addEventListener("click", () => options[Number(btn.dataset.idx)].onSelect());
    });
  }

  function renderInfo({ eyebrow, title, lead, iconSvg, actions }) {
    return `
      <div class="step-eyebrow" style="text-align:center;">${eyebrow}</div>
      <div class="info-panel">
        <div class="info-icon">${iconSvg}</div>
        <h2 class="step-title">${title}</h2>
        <p>${lead}</p>
        <div>
          ${actions.map((a, i) => `<a class="btn ${a.secondary ? "secondary" : ""}" href="${a.href}">${a.label}</a>`).join("")}
        </div>
      </div>
    `;
  }

  const PAIN_OPTIONS = [
    { key: "analog", label: "アナログな業務をデジタル化したい" },
    { key: "excel", label: "Excelマクロの管理・改善に困っている" },
    { key: "rpa", label: "RPAを使った自動化を検討したい" },
    { key: "dx", label: "DX推進の進め方に悩んでいる" },
    { key: "ai", label: "AI活用を検討したい" },
    { key: "other", label: "その他、具体的な課題がある" },
  ];

  function renderPainPoints({ eyebrow, title, lead, contactType }) {
    return `
      <div class="step-eyebrow">${eyebrow}</div>
      <h2 class="step-title">${title}</h2>
      <p class="step-lead">${lead}</p>
      <ul class="pain-list" id="painList">
        ${PAIN_OPTIONS.map((p) => `
          <li class="pain-item">
            <label>
              <input type="checkbox" value="${p.key}" data-label="${p.label}">
              <span>${p.label}</span>
            </label>
            ${p.key === "other" ? `<textarea class="pain-detail" id="painOtherDetail" placeholder="差し支えなければ、具体的な状況をご記入ください"></textarea>` : ""}
          </li>
        `).join("")}
      </ul>
      <div class="pain-actions">
        <button type="button" class="btn" id="painNext" disabled data-contact-type="${contactType}">この内容で相談する →</button>
      </div>
    `;
  }

  function bindPainPoints() {
    const checks = stage.querySelectorAll('.pain-item input[type="checkbox"]');
    const nextBtn = document.getElementById("painNext");
    const otherCheck = stage.querySelector('input[value="other"]');
    const otherDetail = document.getElementById("painOtherDetail");

    function refresh() {
      const anyChecked = Array.from(checks).some((c) => c.checked);
      nextBtn.disabled = !anyChecked;
      if (otherCheck) otherDetail.classList.toggle("show", otherCheck.checked);
    }
    checks.forEach((c) => c.addEventListener("change", refresh));
    refresh();

    nextBtn.addEventListener("click", () => {
      const selected = Array.from(checks).filter((c) => c.checked);
      let msg = "【お困りの点】\n" + selected.map((c) => "・" + c.dataset.label).join("\n");
      if (otherCheck && otherCheck.checked && otherDetail.value.trim()) {
        msg += "\n\n【その他・詳細】\n" + otherDetail.value.trim();
      }
      const type = nextBtn.dataset.contactType;
      window.location.href = `contact.html?type=${encodeURIComponent(type)}&msg=${encodeURIComponent(msg)}`;
    });
  }

  const WEB_APPS = [
    {
      key: "checkin",
      name: "受付・入退室管理",
      icon: ICONS.door,
      desc: "来訪者の受付から入退室ログの記録・集計までを行うWebアプリです。学校やオフィスなど、来訪者管理が必要な現場向けに開発しました。QRコードでの受付や、管理者による入退室状況の一覧確認に対応しています。",
    },
  ];

  function renderAppGallery() {
    return `
      <div class="step-eyebrow">Webアプリ</div>
      <h2 class="step-title">開発したWebアプリ</h2>
      <p class="step-lead">気になるアプリを選ぶと、詳細をご覧いただけます。</p>
      <div class="app-grid">
        ${WEB_APPS.map((a, i) => `
          <button type="button" class="app-card" data-idx="${i}">
            <span class="ai-icon">${a.icon}</span>
            <h3>${a.name}</h3>
          </button>
        `).join("")}
      </div>
    `;
  }

  function renderAppDetail(app) {
    const msg = `Webアプリ「${app.name}」について問い合わせます。\n\n`;
    return `
      <div class="step-eyebrow">Webアプリ</div>
      <div class="app-detail">
        <div class="ai-icon-lg">${app.icon}</div>
        <h2 class="step-title">${app.name}</h2>
        <p>${app.desc}</p>
        <a class="btn" href="contact.html?type=webapp&msg=${encodeURIComponent(msg)}">このアプリについて問い合わせる</a>
      </div>
    `;
  }

  // --- 各ステップ定義 ---

  function goRoot() {
    history.length = 0;
    push("事業内容", () => {
      const options = [
        { icon: ICONS.school, title: "公立・私立学校 / 教育委員会関係者", desc: "学校業務支援システムFELDNAや、DX相談について", onSelect: goSchool },
        { icon: ICONS.building, title: "民間企業", desc: "アプリ開発の実績や、業務のご相談について", onSelect: goCompany },
      ];
      stage.innerHTML = renderOptions({
        eyebrow: "Q1",
        title: "どちらに近いですか？",
        lead: "あなたの立場に近いものを選んでください。",
        options,
      });
      bindOptions(options);
    });
  }

  function goSchool() {
    push("学校・教育委員会", () => {
      const options = [
        { icon: ICONS.feldna, title: "オールインワン×カスタマイズ型 校務支援システム FELDNA", desc: "学校業務を1機能から選んで導入できるシステムです", onSelect: goFeldna },
        { icon: ICONS.chat, title: "業務効率化・DX相談ミーティング（無料）", desc: "現場のお困りごとを無料でご相談いただけます", onSelect: () => goPainPoints({ eyebrow: "業務効率化・DX相談ミーティング（無料）", contactType: "school_dx" }) },
        { icon: ICONS.mail, title: "その他ご相談", desc: "上記に当てはまらないご相談はこちら", onSelect: () => goSimpleContact({ eyebrow: "その他ご相談", contactType: "school_other" }) },
      ];
      stage.innerHTML = renderOptions({
        eyebrow: "A1 学校・教育委員会関係者",
        title: "何についてお知りになりたいですか？",
        lead: "選んだ内容に応じて、次のご案内をします。",
        options,
      });
      bindOptions(options);
    });
  }

  function goFeldna() {
    push("FELDNA", () => {
      const options = [
        { icon: ICONS.userPlus, title: "登録して使ってみたい", desc: "ユーザー新規登録ページへ", onSelect: () => leaveTo("feldna_register") },
        { icon: ICONS.eye, title: "とりあえず画面だけ見てみたい", desc: "ゲストとしてお試しいただけるページへ", onSelect: () => leaveTo("feldna_guest") },
        { icon: ICONS.book, title: "知りたい", desc: "FELDNAのサービス概要ページへ", onSelect: () => fadeNavigate("feldna.html") },
      ];
      stage.innerHTML = renderOptions({
        eyebrow: "FELDNA",
        title: "FELDNAをどのように知りたいですか？",
        lead: "選んだ内容に応じたページへご案内します。",
        options,
      });
      bindOptions(options);
    });
  }

  function leaveTo(kind) {
    const info = kind === "feldna_register"
      ? {
          eyebrow: "新規登録",
          title: "ただいま準備中です",
          lead: "FELDNAのユーザー新規登録は、現在準備を進めています。公開まで今しばらくお待ちください。ご希望の方には、公開時に個別でご案内いたします。",
          contactMsg: "FELDNAのユーザー新規登録の公開時に、案内を希望します。",
        }
      : {
          eyebrow: "ゲスト体験",
          title: "ただいま準備中です",
          lead: "ゲストとして画面をお試しいただける機能は、現在準備を進めています。公開まで今しばらくお待ちください。",
          contactMsg: "FELDNAのゲスト体験の公開時に、案内を希望します。",
        };
    push(info.eyebrow, () => {
      stage.innerHTML = renderInfo({
        eyebrow: "FELDNA / " + info.eyebrow,
        title: info.title,
        lead: info.lead,
        iconSvg: ICONS.tools,
        actions: [
          { label: "公開時の連絡を希望する", href: `contact.html?type=feldna_other&msg=${encodeURIComponent(info.contactMsg)}` },
          { label: "サービス概要ページを見る", href: "feldna.html", secondary: true },
        ],
      });
    });
  }

  function goPainPoints({ eyebrow, contactType }) {
    push(eyebrow, () => {
      stage.innerHTML = renderPainPoints({
        eyebrow,
        title: "お困りの点をお選びください",
        lead: "当てはまるものをすべてお選びください。内容はお問い合わせフォームに引き継がれます。",
        contactType,
      });
      bindPainPoints();
    });
  }

  function goSimpleContact({ eyebrow, contactType }) {
    push(eyebrow, () => {
      stage.innerHTML = renderInfo({
        eyebrow,
        title: "お問い合わせフォームへご案内します",
        lead: "メールアドレス・お名前・ご相談内容をご入力いただく、シンプルなフォームです。",
        iconSvg: ICONS.mail,
        actions: [
          { label: "お問い合わせフォームへ進む", href: `contact.html?type=${contactType}` },
        ],
      });
    });
  }

  function goCompany() {
    push("民間企業", () => {
      const options = [
        { icon: ICONS.web, title: "Webアプリ", desc: "開発実績のあるWebアプリをご覧いただけます", onSelect: goWebApps },
        { icon: ICONS.apple, title: "iOSアプリ", desc: "開発実績のあるiOSアプリをご覧いただけます", onSelect: goIosApps },
        { icon: ICONS.spark, title: "業務について相談（スポットコンサル）", desc: "現場のお困りごとをスポットでご相談いただけます", onSelect: () => goPainPoints({ eyebrow: "業務について相談（スポットコンサル）", contactType: "spot_consulting" }) },
      ];
      stage.innerHTML = renderOptions({
        eyebrow: "A2 民間企業",
        title: "何についてお知りになりたいですか？",
        lead: "選んだ内容に応じて、次のご案内をします。",
        options,
      });
      bindOptions(options);
    });
  }

  function goWebApps() {
    push("Webアプリ", () => {
      stage.innerHTML = renderAppGallery();
      stage.querySelectorAll(".app-card").forEach((btn) => {
        btn.addEventListener("click", () => goWebAppDetail(WEB_APPS[Number(btn.dataset.idx)]));
      });
    });
  }

  function goWebAppDetail(app) {
    push(app.name, () => {
      stage.innerHTML = renderAppDetail(app);
    });
  }

  function goIosApps() {
    push("iOSアプリ", () => {
      stage.innerHTML = renderInfo({
        eyebrow: "iOSアプリ",
        title: "ただいま準備中です",
        lead: "iOSアプリの開発実績は、現在準備を進めています。公開まで今しばらくお待ちください。",
        iconSvg: ICONS.tools,
        actions: [
          { label: "公開時の連絡を希望する", href: `contact.html?type=iosapp&msg=${encodeURIComponent("iOSアプリの公開について、案内を希望します。")}` },
        ],
      });
    });
  }

  function fadeNavigate(url) {
    document.querySelector(".wizard-card").style.transition = "opacity .28s ease";
    document.querySelector(".wizard-card").style.opacity = "0";
    setTimeout(() => { window.location.href = url; }, 240);
  }

  // --- 履歴管理とアニメーション ---

  function push(label, render) {
    history.push({ label, render });
    renderCurrent(true);
  }

  function renderCurrent(animateIn) {
    const current = history[history.length - 1];
    const doRender = () => {
      current.render();
      updateChrome();
      requestAnimationFrame(() => stage.classList.remove("stage-hidden"));
    };
    if (animateIn && stage.innerHTML.trim() !== "") {
      stage.classList.add("stage-hidden");
      setTimeout(doRender, 220);
    } else {
      stage.classList.add("stage-hidden");
      doRender();
    }
  }

  function updateChrome() {
    backBtn.hidden = history.length <= 1;
    crumbsEl.innerHTML = history.map((h, i) => {
      const isLast = i === history.length - 1;
      return `${i > 0 ? '<span class="sep">›</span>' : ""}<button type="button" class="${isLast ? "current" : ""}" data-jump="${i}">${h.label}</button>`;
    }).join("");
    crumbsEl.querySelectorAll("button[data-jump]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.jump);
        if (idx === history.length - 1) return;
        history.length = idx + 1;
        renderCurrent(true);
      });
    });
  }

  backBtn.addEventListener("click", () => {
    if (history.length <= 1) return;
    history.pop();
    renderCurrent(true);
  });

  goRoot();
</script>

</body>
</html>
